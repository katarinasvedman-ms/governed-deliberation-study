<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1470" viewBox="0 0 1800 1470" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Actor, supervisor, shared working memory and interrupts</title>
<desc id="svg-desc">A fast actor and slow supervisor operate in parallel. Both read shared working memory. The supervisor proposes updates to one coordinator, which commits accepted revisions and interrupts pending actor decisions. A governed gateway controls diagnostics. Observations feed the shared history.</desc>
<rect width="1800" height="1470" fill="white"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#000000" text-anchor="start">
<tspan x="100" y="76">Fast action + ongoing supervision + shared working memory</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="start">
<tspan x="100" y="122">Conceptual design amendment | One incident | Memory shapes later behavior; interrupts make accepted changes effective promptly.</tspan>
</text>
<rect x="100" y="260" width="360" height="240" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="middle">
<tspan x="280" y="316.2">FAST ACTOR</tspan>
<tspan x="280" y="344.8"></tspan>
<tspan x="280" y="373.4">Respond to incident events</tspan>
<tspan x="280" y="402">Choose bounded diagnostics</tspan>
<tspan x="280" y="430.6">Read an immutable snapshot</tspan>
<tspan x="280" y="459.2">Reconsider after an interrupt</tspan>
</text>
<rect x="680" y="240" width="440" height="360" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="middle">
<tspan x="900" y="313.29999999999995">SHARED WORKING MEMORY</tspan>
<tspan x="900" y="341.9"></tspan>
<tspan x="900" y="370.49999999999994">Observations: append-only facts</tspan>
<tspan x="900" y="399.09999999999997">Beliefs: provisional + evidence-linked</tspan>
<tspan x="900" y="427.69999999999993">Direction: recommended focus</tspan>
<tspan x="900" y="456.29999999999995"></tspan>
<tspan x="900" y="484.9">Versioned within this incident</tspan>
<tspan x="900" y="513.5">Retain revision and evidence lineage</tspan>
<tspan x="900" y="542.0999999999999">Accepted does not mean true</tspan>
</text>
<rect x="1320" y="260" width="380" height="240" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="middle">
<tspan x="1510" y="316.2">SLOW SUPERVISOR</tspan>
<tspan x="1510" y="344.8"></tspan>
<tspan x="1510" y="373.4">Review history and outcomes</tspan>
<tspan x="1510" y="402">Reflect while the actor works</tspan>
<tspan x="1510" y="430.6">Propose beliefs and direction</tspan>
<tspan x="1510" y="459.2">No private tools or hidden truth</tspan>
</text>
<rect x="680" y="820" width="440" height="240" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="middle">
<tspan x="900" y="861.9">ONE COORDINATOR</tspan>
<tspan x="900" y="890.5"></tspan>
<tspan x="900" y="919.1">Validate proposed updates</tspan>
<tspan x="900" y="947.6999999999999">Check base revision / applicability</tspan>
<tspan x="900" y="976.3">Commit a new memory version</tspan>
<tspan x="900" y="1004.9">Invalidate pending decision generation</tspan>
<tspan x="900" y="1033.5">Own scheduling and dispatch eligibility</tspan>
</text>
<rect x="100" y="820" width="360" height="240" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="middle">
<tspan x="280" y="876.2">GOVERNED EXECUTION</tspan>
<tspan x="280" y="904.8000000000001"></tspan>
<tspan x="280" y="933.4000000000001">Recheck decision generation</tspan>
<tspan x="280" y="962">Apply policy + verification</tspan>
<tspan x="280" y="990.6">Registered diagnostics only</tspan>
<tspan x="280" y="1019.2">No production remediation</tspan>
</text>
<rect x="100" y="1160" width="360" height="180" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="middle">
<tspan x="280" y="1214.8">INCIDENT ENVIRONMENT</tspan>
<tspan x="280" y="1243.3999999999999"></tspan>
<tspan x="280" y="1272">Events + diagnostic results</tspan>
<tspan x="280" y="1300.6">The world keeps changing</tspan>
</text>
<rect x="1320" y="820" width="380" height="240" rx="14" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="middle">
<tspan x="1510" y="861.9">INTERRUPT != OBEDIENCE</tspan>
<tspan x="1510" y="890.5"></tspan>
<tspan x="1510" y="919.1">Actionable updates preempt</tspan>
<tspan x="1510" y="947.6999999999999">Invalid or unchanged: log only</tspan>
<tspan x="1510" y="976.3">Obsolete results cannot dispatch</tspan>
<tspan x="1510" y="1004.9">Dispatched work may finish</tspan>
<tspan x="1510" y="1033.5">The actor can reject bad advice</tspan>
</text>
<rect x="680" y="1160" width="1020" height="180" rx="14" fill="#F3F2F1" stroke="#495057" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000" text-anchor="middle">
<tspan x="1190" y="1200.5">ACCEPTED ACTIONABLE UPDATE</tspan>
<tspan x="1190" y="1229.1"></tspan>
<tspan x="1190" y="1257.7">1. Commit memory vN+1 and invalidate the old decision under one coordination boundary.</tspan>
<tspan x="1190" y="1286.3">2. Request cancellation; suppress late outputs even when cancellation fails.</tspan>
<tspan x="1190" y="1314.9">3. Reconsider with current evidence + memory vN+1; later turns retain applicable state.</tspan>
</text>
<polyline points="680,340 460,340" fill="none" stroke="#5C2D91" stroke-width="2" />
<polyline points="475.3076007399955,332.6055859201091 460,340 475.3076007399955,347.3944140798909" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start">
<tspan x="478" y="298">Read snapshot</tspan>
<tspan x="478" y="321.4">memory vN</tspan>
</text>
<polyline points="1120,340 1320,340" fill="none" stroke="#5C2D91" stroke-width="2" />
<polyline points="1304.6923992600045,347.3944140798909 1320,340 1304.6923992600045,332.6055859201091" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start">
<tspan x="1140" y="298">Read captured</tspan>
<tspan x="1140" y="321.4">history + memory</tspan>
</text>
<polyline points="1510,500 1510,520 1740,520 1740,720 1180,720 1180,940 1120,940" fill="none" stroke="#5C2D91" stroke-width="2" stroke-dasharray="9 7"/>
<polyline points="1135.3076007399955,932.6055859201091 1120,940 1135.3076007399955,947.3944140798909" fill="none" stroke="#5C2D91" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000" text-anchor="start">
<tspan x="1320" y="575">PROPOSE UPDATE</tspan>
<tspan x="1320" y="601">Base memory revision + evidence</tspan>
<tspan x="1320" y="627">Not a direct memory overwrite</tspan>
</text>
<polyline points="900,820 900,600" fill="none" stroke="#107C10" stroke-width="2" />
<polyline points="907.3944140798909,615.3076007399955 900,600 892.6055859201091,615.3076007399955" fill="none" stroke="#107C10" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000" text-anchor="start">
<tspan x="924" y="674">COMMIT vN+1</tspan>
<tspan x="924" y="698.7">Validated structure / scope</tspan>
<tspan x="924" y="723.4">Not verified belief truth</tspan>
</text>
<polyline points="680,880 560,880 560,620 350,620 350,500" fill="none" stroke="#D13438" stroke-width="4" />
<polyline points="357.3944140798909,515.3076007399955 350,500 342.6055859201091,515.3076007399955" fill="none" stroke="#D13438" stroke-width="4"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000" text-anchor="start">
<tspan x="370" y="559">INTERRUPT + RECONSIDER</tspan>
<tspan x="370" y="583.7">Accepted actionable change only</tspan>
</text>
<polyline points="200,500 200,820" fill="none" stroke="#0078D4" stroke-width="2" />
<polyline points="192.6055859201091,804.6923992600045 200,820 207.3944140798909,804.6923992600045" fill="none" stroke="#0078D4" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000" text-anchor="start">
<tspan x="225" y="739">Proposed diagnostic action</tspan>
<tspan x="225" y="763.7">Snapshot + decision generation</tspan>
</text>
<polyline points="280,1060 280,1160" fill="none" stroke="#107C10" stroke-width="2" />
<polyline points="272.6055859201091,1144.6923992600045 280,1160 287.3944140798909,1144.6923992600045" fill="none" stroke="#107C10" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000" text-anchor="start">
<tspan x="300" y="1109">Permitted diagnostic</tspan>
</text>
<polyline points="100,1240 40,1240 40,190 740,190 740,240" fill="none" stroke="#0078D4" stroke-width="2" />
<polyline points="732.6055859201091,224.6923992600045 740,240 747.3944140798909,224.6923992600045" fill="none" stroke="#0078D4" stroke-width="2"/>
<text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000000" text-anchor="start">
<tspan x="100" y="218">Append observed events and outcomes via the coordinator</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#000000" text-anchor="start">
<tspan x="1120" y="437">PARALLEL</tspan>
<tspan x="1120" y="459.1">Independent invocations;</tspan>
<tspan x="1120" y="481.2">no shared graph barrier</tspan>
</text>
<text font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#000000" text-anchor="start">
<tspan x="100" y="1399">Agent Framework: isolated invocation workflows. Coordinator: independent clock, memory versions and interrupts.</tspan>
<tspan x="100" y="1423.7">Memory amendment is proposed, not implemented. No cross-incident learning, automatic model training, or permission changes.</tspan>
</text>
</svg>
